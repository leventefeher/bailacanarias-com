heroImage: /images/heroes/320A0372.jpg
introEn: Tenerife offers many events around the island catering to salsa,
  bachata, and kizomba dancers. Here are some of the most popular social dance
  parties.
introEs: Tenerife ofrece numerosos eventos en toda la isla para bailarines de
  salsa, bachata y kizomba. A continuación, se muestran algunas de las fiestas
  de baile social más populares.
noteEn: Although most of these are regular events, please check if they happen
  on the day, as cancellations and changes often occur.
noteEs: Aunque la mayoría de estos son eventos regulares, verifica si se llevan
  a cabo el día indicado, ya que suelen ocurrir cancelaciones y cambios.
parties:
  - dayEn: Monday & Tuesday
    dayEs: Lunes y Martes
    dayNoteEn: No weekly parties on Monday and Tuesday — however you can always find
      classes in the many dance schools on the island.
    dayNoteEs: Los lunes y martes no hay fiestas semanales, sin embargo siempre
      puedes encontrar clases en las numerosas escuelas de baile de la isla.
  - dayEn: Wednesday
    dayEs: Miércoles
    eventsRaw: |-
      Afrolatin Night | Kendo Lounge Bar, Las Americas | Bachata & Salsa | Bachata y Salsa | https://www.instagram.com/guaguancoevents_tnfe/ | https://www.google.com/maps/search/?api=1&query=Kendo%20Lounge%20Bar%2C%20Las%20Americas%2C%20Tenerife | south

      Bachatón | La Movie Social Club, Santa Cruz | Bachata | Bachata | https://www.instagram.com/sesionesbailetenerife/ | https://www.google.com/maps/search/?api=1&query=La%20Movie%20Social%20Club%2C%20Paseo%20Milicias%20de%20Garachico%201%2C%20Santa%20Cruz%2C%20Tenerife | North
  - dayEn: Thursday
    dayEs: Jueves
    eventsRaw: Tempo's Latinos | Las Americas | Salsa & Bachata | Salsa y Bachata |
      https://www.facebook.com/pablo.casaviejamedina |  | south
  - dayEn: Friday
    dayEs: Viernes
    eventsRaw: >-
      Deseo en Casablanca | Las Americas | Salsa, Bachata | Bachata y Salsa |
      https://www.instagram.com/casablancadiscobar.tf |  | south


      Baila Q' Baila | Las Chafiras | Salsa, Bachata, Merengue | Salsa, Bachata,
      Merengue | https://www.facebook.com/santi.martinsantos |  | south
  - dayEn: Saturday
    dayEs: Sábado
    dayNoteEn: Check Instagram for Saturday events.
    dayNoteEs: Consulta Instagram para eventos del sábado.
  - dayEn: Sunday
    dayEs: Domingo
    eventsRaw: >-
      Latin Flow en Casablanca | Las Americas | Bachata & Salsa | Bachata y
      Salsa | https://www.instagram.com/casablancadiscobar.tf |  | south


      Baila Q' Baila | Las Chafiras | Salsa, Bachata, Kizomba | Salsa, Bachata,
      Kizomba | https://www.facebook.com/FrankyTenerife |  | southeast


      Social 100% Zouk | Santa Cruz | Zouk | Zouk |
      https://www.instagram.com/zoukcanaryislands/p/DcvoArHOzXk/ |  | North
