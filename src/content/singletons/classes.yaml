    titleEn: Beginners Bachata
    titleEs: Bachata Nivel 0
    location: Tenerife Movement Studio, Los Gigantes
    time: '18:00–19:00'
    descriptionEn: >-
      Monday weekly classes at Tenerife Movement Studio in Los Gigantes (<a
      href="https://maps.app.goo.gl/xcVgBXaMSCNxQQNAA" target="_blank"
      rel="noopener">view on map</a>). Every Monday from 18:00 to 19:00.

      The class is divided into bachata moderna/sensual and traditional styles
      to help you understand the development of Bachata and how it evolved from
      the Dominican Republic. Please let us know on WhatsApp before attending,
      as sometimes we have to change the schedule at short notice.

      New to bachata? <a href="/beginners-bachata/">See everything about the
      beginners group</a>, including what happens in your first few weeks.
    descriptionEs: >-
      Las clases semanales de los lunes se imparten en Tenerife Movement Studio
      en Los Gigantes (<a href="https://maps.app.goo.gl/xcVgBXaMSCNxQQNAA"
      target="_blank" rel="noopener">ver en el mapa</a>). Todos los lunes de
      18:00 a 19:00.

      La clase se divide en estilos de bachata moderna/sensual y tradicional
      para ayudarte a comprender el desarrollo de la bachata y cómo evolucionó
      desde la República Dominicana.

      ¿Nunca has bailado bachata? <a href="/es/bachata-para-principiantes/">Toda
      la información del grupo de principiantes</a>, incluido lo que verás en
      tus primeras semanas.
    priceEn: 10€ / class · 35€ for 4 classes · 50€ for a couple for 4 classes
    priceEs: 10€ / clase · 35€ por 4 clases · 50€ por pareja para 4 clases
