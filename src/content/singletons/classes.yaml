    titleEn: Improvers Bachata
    titleEs: Bachata Nivel 1
    location: B-Yard Food Court, Puerto Santiago
    time: '18:00–19:00'
    descriptionEn: >-
      Tuesday weekly classes at B-Yard, Puerto Santiago. Every Tuesday from
      18:00 to 19:00.

      Bachata Moderna/Sensual and Traditional style. Suitable for people who are
      familiar with the basic steps, leading and following techniques and turn
      patterns. Welcome to drop in and join whenever you like. Please let us
      know on WhatsApp before attending, as sometimes we have to change the
      schedule at short notice.
    descriptionEs: >-
      Clases semanales los martes, de 18:00 a 19:00 en B-Yard Food Court, Puerto
      Santiago. Bachata Moderna/Estilo sensual y tradicional.

      Apto para personas que estén familiarizadas con los pasos básicos,
      técnicas de dirección y seguimiento, y patrones de giro.
    priceEn: 10€ / class · 35€ for 4 classes · 50€ for a couple for 4 classes
    priceEs: 10€ / clase · 35€ por 4 clases · 50€ por pareja para 4 clases
