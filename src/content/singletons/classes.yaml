heroImage: /images/2024/09/Nadina-Levente-Demo-e1726400010348.jpg
introEn: >-
  Do you want to join our classes and learn to dance? You are in the right
  place. We offer salsa, bachata, and kizomba classes, workshops, courses,
  private classes and more. Find our upcoming and ongoing events below.
introEs: >-
  ¿Quieres unirte a nuestras clases y aprender a bailar? Estás en el lugar
  correcto. Ofrecemos clases de salsa, bachata, kizomba, talleres, cursos,
  clases privadas y más. Encuentra nuestros próximos eventos y los que ya están
  en marcha.
classes:
  - dayEn: TUESDAYS
    dayEs: MARTES
    levelEn: Level 0 — Beginners
    levelEs: Nivel 0 — Principiantes
    titleEn: Beginners Bachata
    titleEs: Bachata Nivel 0
    location: Tenerife Movement Studio, Los Gigantes
    time: '19:15–20:15'
    descriptionEn: >-
      Tuesday weekly classes at Tenerife Movement Studio in Los Gigantes (<a
      href="https://maps.app.goo.gl/xcVgBXaMSCNxQQNAA" target="_blank"
      rel="noopener">view on map</a>). Every Tuesday from 19:15 to 20:15.

      The class is divided into bachata moderna/sensual and traditional styles
      to help you understand the development of Bachata and how it evolved from
      the Dominican Republic. Please let us know on WhatsApp before attending,
      as sometimes we have to change the schedule at short notice.
    descriptionEs: >-
      Las clases semanales de los martes se imparten en Tenerife Movement Studio
      en Los Gigantes (<a href="https://maps.app.goo.gl/xcVgBXaMSCNxQQNAA"
      target="_blank" rel="noopener">ver en el mapa</a>). Todos los martes de
      19:15 a 20:15.

      La clase se divide en estilos de bachata moderna/sensual y tradicional
      para ayudarte a comprender el desarrollo de la bachata y cómo evolucionó
      desde la República Dominicana.
    priceEn: 10€ / class · 35€ for 4 classes · 50€ for a couple for 4 classes
    priceEs: 10€ / clase · 35€ por 4 clases · 50€ por pareja para 4 clases
  - dayEn: TUESDAYS
